<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pincode to Location</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      background: #333;
    }

    /* Sliding background */
    @keyframes slide {
      0% { background-position: 0 0; }
      100% { background-position: 200% 0; }
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(0, 150, 136, 0.7), rgba(3, 169, 244, 0.7)), url('https://images.unsplash.com/photo-1584476378473-0baadd5463af?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080') no-repeat center center/cover;
      z-index: -1;
      animation: slide 12s infinite linear;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .container h2 {
      margin-bottom: 20px;
      color: #03a9f4;
    }

    .container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
    }

    .container button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      color: white;
      background: linear-gradient(90deg, #009688, #03a9f4);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .container button:hover {
      background: linear-gradient(90deg, #03a9f4, #009688);
    }

    .result {
      margin-top: 20px;
      text-align: left;
    }

    .result p {
      margin: 5px 0;
      color: #eee;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #fff;
    }

    footer span {
      color: #03a9f4;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Pincode to Location</h2>
    <input type="text" id="pincode" placeholder="Enter Pincode" />
    <button onclick="getLocation()">Get Location</button>

    <div class="result" id="result"></div>
    <footer>
      Designed by <span>Sheshagiri</span> &bull; Copyright Reserved 2024
    </footer>
  </div>

  <script>
    async function getLocation() {
      const pincode = document.getElementById('pincode').value.trim();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';

      if (!pincode || isNaN(pincode) || pincode.length !== 6) {
        resultDiv.innerHTML = '<p>Please enter a valid 6-digit pincode.</p>';
        return;
      }

      try {
        const response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
        const data = await response.json();

        if (data[0].Status === "Success") {
          const postOffices = data[0].PostOffice;

          if (postOffices && postOffices.length > 0) {
            const mainOffice = postOffices[0];
            const areas = postOffices.map((office) => office.Name).join(', ');

            resultDiv.innerHTML = `
              <p><strong>Area:</strong> ${mainOffice.Name}</p>
              <p><strong>Pincode:</strong> ${mainOffice.Pincode}</p>
              <p><strong>City:</strong> ${mainOffice.Block}</p>
              <p><strong>State:</strong> ${mainOffice.State}</p>
              <p><strong>District:</strong> ${mainOffice.District}</p>
              <p><strong>Nearby Areas:</strong> ${areas}</p>
              <p><strong>Country:</strong> ${mainOffice.Country}</p>
            `;
          } else {
            resultDiv.innerHTML = '<p>No data found for this pincode.</p>';
          }
        } else {
          resultDiv.innerHTML = '<p>No data found for this pincode.</p>';
        }
      } catch (error) {
        resultDiv.innerHTML = '<p>Error fetching data. Please try again.</p>';
      }
    }
  </script>
</body>
</html>
